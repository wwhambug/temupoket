<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202934"><title>TEMUPOKET — Rebuild</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main id="shell">
 <div id="viewport-wrap"><div id="game" aria-label="TEMUPOKET 게임 화면">
  <div id="landscape"></div><div id="shade"></div>
  <header><span class="brand">TEMUPOKET <small>REBUILD</small></span><span id="stage-label">새로운 모험</span><button id="settings-button" aria-label="설정">설정</button></header>
  <section id="battle" hidden>
   <div id="enemy-panel" class="hp-panel"><div class="identity"><strong id="enemy-name"></strong><span id="enemy-level"></span></div><div class="hp-row"><b>HP</b><div class="bar"><i id="enemy-bar"></i></div></div><div class="panel-foot"><span id="enemy-types"></span><span id="enemy-hp"></span></div><span id="enemy-status" class="status-tag"></span></div>
   <div id="enemy-actor" class="actor"><img id="enemy-sprite" alt="敵モンスター"><div class="effects"></div></div>
   <div id="player-actor" class="actor"><img id="player-sprite" alt="내 캐릭터"><div class="effects"></div></div>
   <div id="player-panel" class="hp-panel"><div class="identity"><strong id="player-name"></strong><span id="player-level"></span></div><div class="hp-row"><b>HP</b><div class="bar"><i id="player-bar"></i></div></div><div class="panel-foot"><span id="player-types"></span><span id="player-hp"></span></div><div class="exp-bar"><i id="exp-bar"></i></div><span id="player-status" class="status-tag"></span></div>
   <div id="battle-text" role="status" aria-live="polite"></div>
   <footer id="command-box"><div id="moves"></div><aside id="move-info"><span class="muted">기술 선택</span><p>방향키 · A / Enter<br>1–4 바로 사용</p></aside></footer>
  </section>
  <section id="overlay" class="overlay"></section>
  <section id="settings" class="overlay" hidden><div class="settings-card"><span class="eyebrow">OPTIONS</span><h2>설정</h2><label>효과음 <input id="sound-setting" type="checkbox"></label><label>빠른 전투 <input id="fast-setting" type="checkbox"></label><label>연출 줄이기 <input id="motion-setting" type="checkbox"></label><p>방향키: 선택 · Enter / A: 실행 · Esc / B: 뒤로<br>전투 중 1–4: 기술 바로 사용</p><button id="close-settings" class="primary">돌아가기</button></div></section>
 </div></div>
 <div id="touch-controls" aria-label="터치 컨트롤"><div class="dpad"><button data-dir="up" aria-label="위">▲</button><button data-dir="left" aria-label="왼쪽">◀</button><span></span><button data-dir="right" aria-label="오른쪽">▶</button><button data-dir="down" aria-label="아래">▼</button></div><span class="control-label">TEMUPOKET<br><small>POCKET SYSTEM</small></span><div class="ab"><button id="touch-b" aria-label="뒤로">B</button><button id="touch-a" aria-label="선택">A</button></div></div>
 <p class="desktop-hint">방향키로 선택 · Enter로 실행 · 1–4 기술 사용 <span>정상적인 세계, 비정상적인 동료.</span></p>
</main>
<script src="js/data.js"></script><script src="js/sprite-clips.js"></script><script src="js/battle.js"></script><script src="js/main.js"></script>
</body></html>
